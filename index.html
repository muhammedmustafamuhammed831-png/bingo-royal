<script>
function playRoom(room){
    alert("Welcome to " + room);

    if(room === "Beginner Room"){
        window.location.href = "beginner.html";
    }

    if(room === "VIP Room"){
        window.location.href = "vip.html";
    }

    if(room === "Royal Room"){
        window.location.href = "royal.html";
    }
}
</script>
</body>
<button onclick="playRoom('Beginner Room')">PLAY</button>
<button onclick="playRoom('VIP Room')">PLAY</button>
<button onclick="playRoom('Royal Room')">PLAY</button>
