<script>
let drawn = [];

function drawNumber() {

  if (drawn.length >= 25) return;

  let num;

  do {
    num = Math.floor(Math.random() * 25) + 1;
  } while (drawn.includes(num));

  drawn.push(num);

  document.getElementById("current").innerText = num;

  updateBoard();

  checkWinner();
}

function updateBoard() {

  const boxes = document.querySelectorAll(".number");

  boxes.forEach(box => {

    const value = parseInt(box.innerText);

    if (drawn.includes(value)) {
      box.classList.add("active");
    }

  });
}

function checkWinner() {

  const active = document.querySelectorAll(".active");

  if (active.length == 25) {

    alert("🎉 YOU WIN 🎉");

  }
}
</script>
