<!DOCTYPE html>
<html>
<head>
<title>Beginner Bingo Room</title>

<style>

body{
background:black;
color:white;
font-family:Arial;
text-align:center;
margin:0;
}

.header{
background:#111;
padding:15px;
font-size:30px;
color:gold;
font-weight:bold;
border-bottom:2px solid gold;
}

#number{
font-size:70px;
color:lime;
margin-top:20px;
font-weight:bold;
}

button{
background:gold;
color:black;
border:none;
padding:15px 30px;
font-size:20px;
border-radius:10px;
margin-top:20px;
font-weight:bold;
cursor:pointer;
}

.grid{
width:340px;
margin:30px auto;
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
}

.cell{
height:60px;
background:#111;
border:2px solid gold;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
transition:0.3s;
}

.active{
background:lime;
color:black;
transform:scale(1.1);
}

#winner{
display:none;
font-size:40px;
color:gold;
margin-top:20px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="header">
🎰 Beginner Bingo Room 🎰
</div>

<div id="number">0</div>

<button onclick="drawNumber()">
DRAW NUMBER
</button>

<div class="grid" id="grid"></div>

<div id="winner">
🎉 BINGO WINNER 🎉
</div>

<audio id="sound"
src="https://www.soundjay.com/buttons/sounds/button-09.mp3">
</audio>

<script>

let numbers=[];

for(let i=1;i<=25;i++){
numbers.push(i);
}

let grid=document.getElementById("grid");

for(let i=1;i<=25;i++){

let cell=document.createElement("div");

cell.classList.add("cell");

cell.innerHTML=i;

cell.id="cell"+i;

grid.appendChild(cell);

}

function drawNumber(){

document.getElementById("sound").play();

if(numbers.length==0){

alert("Game Finished");

return;

}

let randomIndex=
Math.floor(Math.random()*numbers.length);

let num=numbers[randomIndex];

numbers.splice(randomIndex,1);

document.getElementById("number")
.innerHTML=num;

let box=document.getElementById("cell"+num);

box.classList.add("active");

checkWinner();

}

function checkWinner(){

let active=
document.querySelectorAll(".active");

if(active.length>=25){

document.getElementById("winner")
.style.display="block";

}

}

</script>

</body>
</html>
