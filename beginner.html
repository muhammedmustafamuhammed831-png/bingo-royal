<!DOCTYPE html>
<html>
<head>
<title>Beginner Bingo Room</title>

<style>

body{
background:#000;
color:white;
text-align:center;
font-family:Arial;
margin:0;
}

h1{
color:gold;
padding:20px;
border-bottom:2px solid gold;
}

#current{
font-size:70px;
color:lime;
margin:20px;
}

button{
background:gold;
border:none;
padding:15px 30px;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.board{
width:270px;
margin:30px auto;
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
}

.number{
border:2px solid gold;
padding:20px 0;
border-radius:10px;
font-size:20px;
}

.active{
background:lime;
color:black;
}

</style>
</head>

<body>

<h1>🎰 Beginner Bingo Room 🎰</h1>

<div id="current">0</div>

<button onclick="drawNumber()">
DRAW NUMBER
</button>

<div class="board">

<div class="number">1</div>
<div class="number">2</div>
<div class="number">3</div>
<div class="number">4</div>
<div class="number">5</div>

<div class="number">6</div>
<div class="number">7</div>
<div class="number">8</div>
<div class="number">9</div>
<div class="number">10</div>

<div class="number">11</div>
<div class="number">12</div>
<div class="number">13</div>
<div class="number">14</div>
<div class="number">15</div>

<div class="number">16</div>
<div class="number">17</div>
<div class="number">18</div>
<div class="number">19</div>
<div class="number">20</div>

<div class="number">21</div>
<div class="number">22</div>
<div class="number">23</div>
<div class="number">24</div>
<div class="number">25</div>

</div>

<script>

const sound = new Audio("https://www.soundjay.com/buttons/sounds/button-3.mp3");

let drawn = [];

function drawNumber(){

if(drawn.length >= 25) return;

let num;

do{
num = Math.floor(Math.random()*25)+1;
}
while(drawn.includes(num));

drawn.push(num);

sound.play();

document.getElementById("current").innerText = num;

const boxes = document.querySelectorAll(".number");

boxes.forEach(box=>{

const value = parseInt(box.innerText);

if(drawn.includes(value)){
box.classList.add("active");
}

});

if(drawn.length == 25){

alert("🎉 YOU WIN 🎉");

}

}

</script>

</body>
</html>
