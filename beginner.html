<!DOCTYPE html>
<html>
<head>
<title>Beginner Bingo Room</title>

<style>
body{
    background:black;
    color:white;
    font-family:Arial;
    text-align:center;
    margin:0;
}

.header{
    background:#111;
    padding:15px;
    color:gold;
    font-size:30px;
    font-weight:bold;
    border-bottom:2px solid gold;
}

#number{
    font-size:60px;
    color:lime;
    margin-top:20px;
    font-weight:bold;
}

button{
    background:gold;
    color:black;
    border:none;
    padding:15px 30px;
    font-size:20px;
    border-radius:10px;
    margin-top:20px;
    font-weight:bold;
}

.grid{
    width:320px;
    margin:30px auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

.cell{
    border:2px solid gold;
    height:55px;
    line-height:55px;
    font-size:22px;
    border-radius:10px;
    background:#111;
    transition:0.3s;
}

.active{
    background:lime;
    color:black;
    font-weight:bold;
    transform:scale(1.1);
}

#winner{
    color:gold;
    font-size:40px;
    margin-top:20px;
    display:none;
}
</style>
</head>

<body>

<div class="header">
🎰 Beginner Bingo Room 🎰
</div>

<div id="number">0</div>

<button onclick="drawNumber()">
DRAW NUMBER
</button>

<div class="grid" id="grid"></div>

<div id="winner">
🎉 BINGO WINNER 🎉
</div>

<script>

let grid = document.getElementById("grid");

for(let i=1;i<=25;i++){

    let cell = document.createElement("div");

    cell.classList.add("cell");

    cell.innerText=i;

    cell.id="cell"+i;

    cell.onclick=function(){

        cell.classList.toggle("active");

        checkWin();

    }

    grid.appendChild(cell);
}

function drawNumber(){

    let random=Math.floor(Math.random()*25)+1;

    document.getElementById("number").innerText=random;

    let box=document.getElementById("cell"+random);

    box.classList.add("active");

    checkWin();
}

function checkWin(){

    let active=document.querySelectorAll(".active");

    if(active.length>=10){

        document.getElementById("winner").style.display="block";

    }
}

</script>

</body>
</html>
