<!DOCTYPE html>
<html>
<head>
<title>Beginner Bingo Room</title>

<style>
body{
background:black;
color:white;
font-family:Arial;
text-align:center;
margin:0;
}

.header{
background:#111;
padding:15px;
font-size:30px;
color:gold;
font-weight:bold;
border-bottom:2px solid gold;
}

#number{
font-size:70px;
color:lime;
margin-top:20px;
font-weight:bold;
}

button{
background:gold;
color:black;
border:none;
padding:15px 30px;
font-size:20px;
border-radius:10px;
margin-top:20px;
font-weight:bold;
}

.grid{
width:340px;
margin:30px auto;
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
}

.cell{
height:60px;
background:#111;
border:2px solid gold;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
}

.active{
background:lime;
color:black;
}

</style>
</head>

<body>

<div class="header">
🎰 Beginner Bingo Room 🎰
</div>

<div id="number">0</div>

<button onclick="drawNumber()">
DRAW NUMBER
</button>

<div class="grid" id="grid"></div>

<audio id="sound">
<source src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg" type="audio/ogg">
</audio>

<script>

let numbers=[];

for(let i=1;i<=25;i++){
numbers.push(i);
}

let grid=document.getElementById("grid");

for(let i=1;i<=25;i++){

grid.innerHTML +=
`<div class="cell" id="n${i}">${i}</div>`;

}

function drawNumber(){

document.getElementById("sound").play();

if(numbers.length==0){
alert("Game Finished");
return;
}

let randomIndex=
Math.floor(Math.random()*numbers.length);

let num=numbers[randomIndex];

numbers.splice(randomIndex,1);

document.getElementById("number")
.innerHTML=num;

document.getElementById("n"+num)
.classList.add("active");

}

</script>
<script>
function checkWinner() {
  const boxes = document.querySelectorAll(".number");

  let win = true;

  boxes.forEach(box => {
    if (!box.classList.contains("active")) {
      win = false;
    }
  });

  if (win) {
    alert("🎉 YOU WIN 🎉");
  }
}

setInterval(checkWinner, 1000);
</script>
</body>
</html>
