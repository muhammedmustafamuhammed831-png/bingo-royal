<!DOCTYPE html>
<html>
<head>
<title>Royal Bingo Room</title>

<style>
body{
background:black;
color:white;
font-family:Arial;
text-align:center;
}

h1{
color:gold;
margin-top:20px;
}

#number{
font-size:60px;
color:lime;
margin:20px;
}

button{
background:gold;
border:none;
padding:15px 30px;
font-size:20px;
border-radius:10px;
font-weight:bold;
margin:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(5,70px);
gap:10px;
justify-content:center;
margin-top:20px;
}

.cell{
width:70px;
height:70px;
border:2px solid gold;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
background:#111;
}

.active{
background:lime;
color:black;
font-weight:bold;
}
</style>
</head>

<body>

<h1>👑 Royal Bingo Room 👑</h1>

<div id="number">0</div>

<button onclick="drawNumber()">DRAW NUMBER</button>

<div class="grid" id="grid"></div>

<script>
let numbers = [];

for(let i=1;i<=100;i++){
numbers.push(i);
}

let grid = document.getElementById("grid");

for(let i=1;i<=100;i++){
grid.innerHTML += `<div class="cell" id="n${i}">${i}</div>`;
}

function drawNumber(){

if(numbers.length==0){
alert("Game Finished");
return;
}

let randomIndex =
Math.floor(Math.random()*numbers.length);

let num = numbers[randomIndex];

numbers.splice(randomIndex,1);

document.getElementById("number").innerText = num;

document.getElementById("n"+num)
.classList.add("active");
}
</script>

</body>
</html>
